name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela ejecuciones viejas del mismo branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ahorcado.slnx

      - name: Build
        run: dotnet build Ahorcado.slnx --no-restore -c Release

      # Solo unit tests: AcceptanceTests suele necesitar navegador/app levantada
      - name: Test
        run: dotnet test Tests --no-build -c Release --logger trx --results-directory TestResults

      # Sube resultados aunque fallen los tests
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
