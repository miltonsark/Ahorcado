name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela ejecuciones viejas del mismo branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ahorcado.slnx

      # Se compila en Debug (default) porque el hook de los AT levanta la web
      # con "dotnet run", que usa Debug: asi reutiliza este build.
      - name: Build
        run: dotnet build Ahorcado.slnx --no-restore

      # Unit tests + coverage del dominio (proyecto Ahorcado). Falla si baja del 90%.
      # El logger GitHubActions arma un resumen con los tests que fallaron y marca
      # cada fallo en la linea del test (se ve en el run y en "Files changed" del PR).
      - name: Unit tests + coverage (minimo 90%)
        run: >
          dotnet test Tests --no-build
          --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
          --logger "GitHubActions;summary-include-passed=false"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../TestResults/coverage/
          /p:Include="[Ahorcado]*"
          /p:Threshold=90

      # Playwright necesita el navegador y sus dependencias del sistema en el runner
      - name: Instalar Chromium para Playwright
        run: pwsh AcceptanceTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # El hook (Support/Hook.cs) levanta WebAhorcado antes de correr los escenarios
      - name: Acceptance tests
        run: dotnet test AcceptanceTests --no-build --logger "trx;LogFileName=acceptance-tests.trx" --logger "GitHubActions;summary-include-passed=false" --results-directory TestResults

      # Sube resultados y coverage aunque fallen los tests
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/coverage/

  # Analisis estatico con SonarQube Cloud (sonarcloud.io): bugs, code smells,
  # vulnerabilidades, duplicacion y cobertura. El reporte queda en el panel web
  # del proyecto y, en los PR, Sonar comenta el resultado del quality gate.
  # Corre en paralelo a build-test y no bloquea el deploy.
  analisis-estatico:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Historial completo: Sonar lo usa para saber que codigo es nuevo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # El scanner de Sonar necesita Java 17 o superior
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # "begin" va antes del build: Sonar analiza el codigo mientras se compila.
      # La cobertura se toma de los unit tests y solo cuenta el dominio,
      # igual que el minimo del 90% del job build-test.
      - name: Iniciar analisis
        run: >
          dotnet sonarscanner begin
          /k:"miltonsark_Ahorcado"
          /o:"miltonsark"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="TestResults/coverage/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"
          /d:sonar.coverage.exclusions="WebAhorcado/**"

      - name: Build
        run: dotnet build Ahorcado.slnx

      - name: Unit tests + coverage
        run: >
          dotnet test Tests --no-build
          --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../TestResults/coverage/
          /p:Include="[Ahorcado]*"

      - name: Enviar analisis a SonarQube Cloud
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Publica la web en GitHub Pages solo si pasaron todos los tests
  # y solo con push a master (al mergear un PR)
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar WebAhorcado
        run: dotnet publish WebAhorcado -c Release -o publish

      # La web queda en /Ahorcado/ y no en la raiz del dominio
      - name: Ajustar para GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/Ahorcado/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
