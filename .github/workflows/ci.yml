name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela ejecuciones viejas del mismo branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ahorcado.slnx

      # Se compila en Debug (default) porque el hook de los AT levanta la web
      # con "dotnet run", que usa Debug: asi reutiliza este build.
      - name: Build
        run: dotnet build Ahorcado.slnx --no-restore

      # Unit tests + coverage del dominio (proyecto Ahorcado). Falla si baja del 90%.
      - name: Unit tests + coverage (minimo 90%)
        run: >
          dotnet test Tests --no-build
          --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=../TestResults/coverage/
          /p:Include="[Ahorcado]*"
          /p:Threshold=90

      # Playwright necesita el navegador y sus dependencias del sistema en el runner
      - name: Instalar Chromium para Playwright
        run: pwsh AcceptanceTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # El hook (Support/Hook.cs) levanta WebAhorcado antes de correr los escenarios
      - name: Acceptance tests
        run: dotnet test AcceptanceTests --no-build --logger "trx;LogFileName=acceptance-tests.trx" --results-directory TestResults

      # Sube resultados y coverage aunque fallen los tests
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/coverage/

  # Publica la web en GitHub Pages solo si pasaron todos los tests
  # y solo con push a master (al mergear un PR)
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar WebAhorcado
        run: dotnet publish WebAhorcado -c Release -o publish

      # La web queda en /Ahorcado/ y no en la raiz del dominio
      - name: Ajustar para GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/Ahorcado/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
